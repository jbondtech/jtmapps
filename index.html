  <script>
    /****************************************************************
     * CONFIGURATION
     ****************************************************************/
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQc3O1ekiNo73ZKbTLq7iYohmpcxsV6i-vNZqMxaFZSiUKSFC-JXsFsyYHv759-m0x/exec";

    /****************************************************************
     * GLOBAL HELPER FUNCTIONS
     ****************************************************************/

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function gcd(a, b) {
      return b === 0 ? Math.abs(a) : gcd(b, a % b);
    }

    /**
     * Fisher-Yates shuffle for unbiased option randomization
     */
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * Deduplicates options for any problem type and guarantees 4 distinct choices
     */
    function ensureUniqueOptions(correctAnswer, rawOptions, fallbackGenerator) {
      let unique = Array.from(new Set(rawOptions));
      
      let attempts = 0;
      while (unique.length < 4 && attempts < 20) {
        attempts++;
        const fallback = fallbackGenerator ? fallbackGenerator(unique.length) : `${parseInt(correctAnswer) || 10} + ${unique.length * 3}`;
        if (!unique.includes(fallback)) {
          unique.push(fallback);
        }
      }
      
      return shuffleArray(unique);
    }

    function generateUniqueBatch(generator, pool, count) {
      const questions = [];
      const seenKeys = new Set();
      const maxAttempts = count * 20;
      let attempts = 0;

      while (questions.length < count && attempts < maxAttempts) {
        attempts++;
        const selectedPool = pool[getRandomInt(0, pool.length - 1)];
        const problem = generator.generateSingleProblem(selectedPool);
        const uniqueKey = `${problem.promptLatex}::${problem.correctAnswer}`;

        if (!seenKeys.has(uniqueKey)) {
          seenKeys.add(uniqueKey);
          questions.push(problem);
        }
      }
      return questions.sort(() => Math.random() - 0.5);
    }

    /****************************************************************
     * GENERATOR CLASSES
     ****************************************************************/

    class WholeNumberArithmeticGenerator {
      constructor() {
        this.allPools = [
          'ADD_2DIGIT_STANDARD', 'ADD_COLUMN_STACK', 'ADD_MIXED_DIGITS', 'ADD_LARGE_NUMBERS',
          'SUB_SIMPLE', 'SUB_REGROUPING', 'SUB_MIXED_DIGITS', 'SUB_LARGE_NUMBERS',
          'MULT_BASIC', 'MULT_ADVANCED', 'DIV_EXACT', 'DIV_REMAINDER'
        ];
      }

      buildVerticalLatex(operands, symbol) {
        const rows = operands.map((num, idx) => 
          idx === operands.length - 1 ? `${symbol} \\quad ${num}` : `${num}`
        );
        return `\\begin{array}{r} ${rows.join(' \\\\ ')} \\\\ \\hline \\end{array}`;
      }

      generateSingleProblem(type) {
        let operands = [], operation = 'ADDITION', symbol = '+', promptLatex = '', correctAnswer = '', promptText = '';

        switch (type) {
          case 'ADD_2DIGIT_STANDARD':
            operands = [getRandomInt(10, 99), getRandomInt(10, 99)];
            break;
          case 'ADD_COLUMN_STACK': {
            const numAddends = getRandomInt(3, 4);
            for (let i = 0; i < numAddends; i++) operands.push(getRandomInt(10, 9999));
            break;
          }
          case 'ADD_MIXED_DIGITS':
            operands = [getRandomInt(10, 99), getRandomInt(1, 9)];
            if (Math.random() > 0.5) operands.reverse();
            break;
          case 'ADD_LARGE_NUMBERS':
            operands = [getRandomInt(1000, 99999), getRandomInt(1000, 99999)];
            break;
          case 'SUB_SIMPLE': {
            operation = 'SUBTRACTION'; symbol = '-';
            const topOnes = getRandomInt(5, 9), bottomOnes = getRandomInt(0, topOnes);
            const topTens = getRandomInt(2, 9), bottomTens = getRandomInt(1, topTens);
            operands = [topTens * 10 + topOnes, bottomTens * 10 + bottomOnes];
            break;
          }
          case 'SUB_REGROUPING': {
            operation = 'SUBTRACTION'; symbol = '-';
            const topOnes = getRandomInt(0, 4), bottomOnes = getRandomInt(5, 9);
            const topTens = getRandomInt(3, 9), bottomTens = getRandomInt(1, topTens - 1);
            operands = [topTens * 10 + topOnes, bottomTens * 10 + bottomOnes];
            break;
          }
          case 'SUB_MIXED_DIGITS':
            operation = 'SUBTRACTION'; symbol = '-';
            operands = [getRandomInt(100, 999), getRandomInt(10, 99)];
            break;
          case 'SUB_LARGE_NUMBERS':
            operation = 'SUBTRACTION'; symbol = '-';
            operands = [getRandomInt(1000, 9999), getRandomInt(100, 999)];
            break;
          case 'MULT_BASIC':
            operation = 'MULTIPLICATION'; symbol = '\\times';
            operands = [getRandomInt(10, 999), getRandomInt(2, 99)];
            break;
          case 'MULT_ADVANCED':
            operation = 'MULTIPLICATION'; symbol = '\\times';
            operands = [getRandomInt(10, 9999), getRandomInt(2, 999)];
            break;
          case 'DIV_EXACT': {
            operation = 'DIVISION';
            const divisor = getRandomInt(2, 99), quotient = getRandomInt(2, 99);
            const dividend = divisor * quotient;
            correctAnswer = `${quotient}`;
            promptText = 'Divide:';
            promptLatex = `${divisor} \\enclose{longdiv}{${dividend}}`;
            break;
          }
          case 'DIV_REMAINDER': {
            operation = 'DIVISION';
            const divisor = getRandomInt(10, 99), quotient = getRandomInt(10, 99), remainder = getRandomInt(1, 9);
            const dividend = divisor * quotient + remainder;
            correctAnswer = `${quotient} R ${remainder}`;
            promptText = 'Divide (include remainder):';
            promptLatex = `${divisor} \\enclose{longdiv}{${dividend}}`;
            break;
          }
        }

        if (operation === 'ADDITION') {
          correctAnswer = `${operands.reduce((a, b) => a + b, 0)}`;
          promptText = 'Calculate the sum:';
          promptLatex = this.buildVerticalLatex(operands, symbol);
        } else if (operation === 'SUBTRACTION') {
          correctAnswer = `${operands[0] - operands[1]}`;
          promptText = 'Calculate the difference:';
          promptLatex = this.buildVerticalLatex(operands, symbol);
        } else if (operation === 'MULTIPLICATION') {
          correctAnswer = `${operands[0] * operands[1]}`;
          promptText = 'Calculate the product:';
          promptLatex = this.buildVerticalLatex(operands, symbol);
        }

        let rawOptions = [];
        if (type === 'DIV_REMAINDER') {
          const [qStr, rStr] = correctAnswer.split(' R ');
          const q = parseInt(qStr), r = parseInt(rStr);
          rawOptions = [correctAnswer, `${q + 1} R ${r}`, `${q} R ${Math.max(1, r - 1)}`, `${q - 1} R ${r + 1}`];
        } else {
          const numAns = parseInt(correctAnswer);
          rawOptions = [`${numAns}`, `${numAns + 10}`, `${Math.max(0, numAns - 10)}`, `${numAns + 1}`];
        }

        const options = ensureUniqueOptions(correctAnswer, rawOptions);

        return {
          id: `wn_${Date.now()}_${getRandomInt(100, 999)}`,
          prompt: promptText,
          promptLatex: `$${promptLatex}$`,
          correctAnswer,
          options,
          explanation: `Result: ${correctAnswer}.`,
          points: 1
        };
      }

      generateBatch(count = 5) {
        return generateUniqueBatch(this, this.allPools, count);
      }
    }

    class FractionArithmeticGenerator {
      constructor() {
        this.allPools = [
          'ADD_LIKE_DENOM', 'ADD_UNLIKE_DENOM', 'ADD_MIXED_STACK', 'ADD_MISSING_VALUE',
          'SUB_SIMPLE_FRACTION', 'SUB_REGROUPING_MIXED', 'SUB_WHOLE_MINUS_MIXED',
          'MULT_PROPER', 'MULT_MIXED', 'DIV_PROPER', 'DIV_MIXED'
        ];
      }

      simplifyFraction(num, den) {
        const common = gcd(num, den);
        const n = num / common, d = den / common;
        if (d === 1) return `${n}`;
        if (n > d) {
          const whole = Math.floor(n / d), rem = n % d;
          return rem === 0 ? `${whole}` : `${whole} \\frac{${rem}}{${d}}`;
        }
        return `\\frac{${n}}{${d}}`;
      }

      buildVerticalLatex(operands, symbol) {
        const rows = operands.map((op, idx) => {
          const prefix = idx === operands.length - 1 ? `${symbol} \\quad ` : '';
          if (op.whole && op.num) return `${prefix}${op.whole} \\frac{${op.num}}{${op.den}}`;
          if (op.whole) return `${prefix}${op.whole}`;
          return `${prefix}\\frac{${op.num}}{${op.den}}`;
        });
        return `\\begin{array}{r} ${rows.join(' \\\\ ')} \\\\ \\hline \\end{array}`;
      }

      generateSingleProblem(type) {
        let promptText = '', promptLatex = '', correctAnswer = '';

        switch (type) {
          case 'ADD_LIKE_DENOM': {
            const den = [2, 4, 5, 8, 10][getRandomInt(0, 4)];
            const w1 = getRandomInt(1, 10), w2 = getRandomInt(1, 10);
            const n1 = getRandomInt(1, den - 1), n2 = getRandomInt(1, den - 1);
            promptText = 'Calculate the sum:';
            promptLatex = `${w1}\\frac{${n1}}{${den}} + ${w2}\\frac{${n2}}{${den}} =`;
            correctAnswer = this.simplifyFraction((w1 * den + n1) + (w2 * den + n2), den);
            break;
          }
          case 'ADD_UNLIKE_DENOM': {
            const den1 = [2, 3, 4, 5][getRandomInt(0, 3)], den2 = [6, 8, 12, 16][getRandomInt(0, 3)];
            const w1 = getRandomInt(1, 15), w2 = getRandomInt(1, 10);
            const n1 = getRandomInt(1, den1 - 1), n2 = getRandomInt(1, den2 - 1);
            promptText = 'Calculate the sum:';
            promptLatex = `${w1}\\frac{${n1}}{${den1}} + ${w2}\\frac{${n2}}{${den2}} =`;
            correctAnswer = this.simplifyFraction((w1 * den1 + n1) * den2 + (w2 * den2 + n2) * den1, den1 * den2);
            break;
          }
          case 'ADD_MIXED_STACK': {
            const numAddends = getRandomInt(2, 3), denChoices = [3, 4, 5, 8, 12], operands = [];
            let totalNum = 0; const commonDen = 120;
            for (let i = 0; i < numAddends; i++) {
              const den = denChoices[getRandomInt(0, denChoices.length - 1)];
              const whole = getRandomInt(1, 10), num = getRandomInt(1, den - 1);
              operands.push({ whole, num, den });
              totalNum += (whole * den + num) * (commonDen / den);
            }
            promptText = 'Calculate the sum:';
            promptLatex = this.buildVerticalLatex(operands, '+');
            correctAnswer = this.simplifyFraction(totalNum, commonDen);
            break;
          }
          case 'ADD_MISSING_VALUE': {
            const w1 = getRandomInt(2, 8), den = [3, 4, 5, 8][getRandomInt(0, 3)];
            const targetW = w1 + getRandomInt(1, 5), targetN = getRandomInt(1, den - 1);
            promptText = 'Find the missing value:';
            promptLatex = `${w1} + \\text{___} = ${targetW}\\frac{${targetN}}{${den}}`;
            correctAnswer = this.simplifyFraction((targetW * den + targetN) - (w1 * den), den);
            break;
          }
          case 'SUB_SIMPLE_FRACTION': {
            const den = [4, 8, 12, 16][getRandomInt(0, 3)];
            const w1 = getRandomInt(10, 30), w2 = getRandomInt(1, 9);
            promptText = 'Calculate the difference:';
            promptLatex = this.buildVerticalLatex([{ whole: w1, num: 3, den }, { whole: w2, num: 1, den }], '-');
            correctAnswer = this.simplifyFraction((w1 * den + 3) - (w2 * den + 1), den);
            break;
          }
          case 'SUB_REGROUPING_MIXED': {
            const den1 = 5, den2 = 4, w1 = 13, w2 = 6, n1 = 1, n2 = 3;
            promptText = 'Calculate the difference:';
            promptLatex = this.buildVerticalLatex([{ whole: w1, num: n1, den: den1 }, { whole: w2, num: n2, den: den2 }], '-');
            correctAnswer = this.simplifyFraction((w1 * den1 + n1) * den2 - (w2 * den2 + n2) * den1, den1 * den2);
            break;
          }
          case 'SUB_WHOLE_MINUS_MIXED': {
            const w1 = getRandomInt(4, 10), den = [3, 4, 8][getRandomInt(0, 2)];
            const targetW = getRandomInt(1, w1 - 2), targetN = getRandomInt(1, den - 1);
            promptText = 'Find the missing value:';
            promptLatex = `${w1} - \\text{___} = ${targetW}\\frac{${targetN}}{${den}}`;
            correctAnswer = this.simplifyFraction(w1 * den - (targetW * den + targetN), den);
            break;
          }
          case 'MULT_PROPER': {
            const n1 = getRandomInt(1, 5), d1 = getRandomInt(n1 + 1, 8);
            const n2 = getRandomInt(1, 7), d2 = getRandomInt(n2 + 1, 16);
            promptText = 'Multiply:';
            promptLatex = `\\frac{${n1}}{${d1}} \\times \\frac{${n2}}{${d2}}`;
            correctAnswer = this.simplifyFraction(n1 * n2, d1 * d2);
            break;
          }
          case 'MULT_MIXED': {
            const w1 = getRandomInt(1, 8), n1 = getRandomInt(1, 3), d1 = getRandomInt(n1 + 1, 5);
            const w2 = getRandomInt(1, 8), n2 = getRandomInt(1, 3), d2 = getRandomInt(n2 + 1, 5);
            promptText = 'Multiply:';
            promptLatex = `${w1}\\frac{${n1}}{${d1}} \\times ${w2}\\frac{${n2}}{${d2}}`;
            correctAnswer = this.simplifyFraction((w1 * d1 + n1) * (w2 * d2 + n2), d1 * d2);
            break;
          }
          case 'DIV_PROPER': {
            const n1 = getRandomInt(1, 7), d1 = getRandomInt(n1 + 1, 20);
            const n2 = getRandomInt(1, 7), d2 = getRandomInt(n2 + 1, 20);
            promptText = 'Divide:';
            promptLatex = `\\frac{${n1}}{${d1}} \\div \\frac{${n2}}{${d2}}`;
            correctAnswer = this.simplifyFraction(n1 * d2, d1 * n2);
            break;
          }
          case 'DIV_MIXED': {
            const w1 = getRandomInt(1, 6), n1 = getRandomInt(1, 3), d1 = getRandomInt(n1 + 1, 5);

      constructor() {

      simplifyFraction(num, den) {
        const common = gcd(num, den);
        const n = num / common;
        const d = den / common;
        if (d === 1) return `${n}`;
        if (n > d) {
          const whole = Math.floor(n / d);
          const rem = n % d;
          return rem === 0 ? `${whole}` : `${whole} \\frac{${rem}}{${d}}`;
        }
        return `\\frac{${n}}{${d}}`;
      }

          const correctAnswer = this.simplifyFraction(n, d);

          const rawOptions = [
            correctAnswer,
            this.simplifyFraction(n + d, d),
            this.simplifyFraction(n + 1, d),

          return {
            id: `fc_${Date.now()}_${getRandomInt(100, 999)}`,

        const options = ensureUniqueOptions(correctAnswer, rawOptions);

        return {
          id: `pemdas_${Date.now()}_${getRandomInt(100, 999)}`,
          prompt: promptText,
          promptLatex: `$${promptLatex}$`,
          correctAnswer,
          options,
          explanation: `Result: ${correctAnswer}.`,
          points: 1
        };
      }

      generateBatch(count = 5) {
        return generateUniqueBatch(this, this.allPools, count);
      }
    }

    class PolynomialArithmeticGenerator {
      constructor() {
        this.allPools = ['STACKED_TWO_VARIABLE', 'HORIZONTAL_COMBINING_LIKE_TERMS'];
      }

      formatTerm(c, v, first) {
        if (c === 0) return '';
        const sign = first ? (c < 0 ? '-' : '') : (c > 0 ? ' + ' : ' - ');
        const absC = Math.abs(c);
        return `${sign}${absC === 1 ? '' : absC}${v}`;
      }

      formatConst(n, first) {
        if (n === 0) return '';
        if (first) return `${n}`;
        return n > 0 ? ` + ${n}` : ` - ${Math.abs(n)}`;
      }

      generateSingleProblem(type) {
        const var1 = ['X', 'Y', 'A', 'M'][getRandomInt(0, 3)];
        const var2 = var1 === 'X' ? 'Y' : (var1 === 'A' ? 'B' : 'N');

        const c1 = getRandomInt(-10, 10) || 1, c2 = getRandomInt(-10, 10) || -1, const1 = getRandomInt(-50, 50);
        const c3 = getRandomInt(-10, 10) || 1, c4 = getRandomInt(-10, 10) || -1, const2 = getRandomInt(-50, 50);

        const isSubtraction = Math.random() > 0.5;

        const res1 = isSubtraction ? c1 - c3 : c1 + c3;
        const res2 = isSubtraction ? c2 - c4 : c2 + c4;
        const resConst = isSubtraction ? const1 - const2 : const1 + const2;

        let resStr = this.formatTerm(res1, var1, true) + this.formatTerm(res2, var2, res1 === 0) + this.formatConst(resConst, res1 === 0 && res2 === 0);
        const correctAnswer = resStr === '' ? '0' : resStr;

        const e1 = `${this.formatTerm(c1, var1, true)}${this.formatTerm(c2, var2)}${this.formatConst(const1)}`;
        const e2 = `${this.formatTerm(c3, var1, true)}${this.formatTerm(c4, var2)}${this.formatConst(const2)}`;

        let promptLatex = '';
        if (type === 'STACKED_TWO_VARIABLE') {
          const secondLine = isSubtraction ? `- (${e2})` : `${e2}`;
          promptLatex = `$$\\begin{array}{r} ${e1} \\\\ ${secondLine} \\\\ \\hline \\end{array}$$`;
        } else {
          const op = isSubtraction ? '-' : '+';
          promptLatex = `$$(${e1}) ${op} (${e2}) = \\text{___}$$`;
        }

        const rawOptions = [
          correctAnswer,
          `${this.formatTerm(res1 + 2, var1, true)}${this.formatTerm(res2, var2)}${this.formatConst(resConst)}`,
          `${this.formatTerm(res1, var1, true)}${this.formatTerm(res2 - 2, var2)}${this.formatConst(resConst)}`,
          `${this.formatTerm(res1, var1, true)}${this.formatTerm(res2, var2)}${this.formatConst(resConst + 5)}`
        ];

        const options = ensureUniqueOptions(correctAnswer, rawOptions);

        return {
          id: `poly_${Date.now()}_${getRandomInt(100, 999)}`,
          prompt: 'Simplify:',
          promptLatex,
          correctAnswer,
          options,
          explanation: `Result: ${correctAnswer}.`,
          points: 1
        };
      }

      generateBatch(count = 5) {
        return generateUniqueBatch(this, this.allPools, count);
      }
    }

    class SystemsOfEquationsGenerator {
      constructor() {
        this.allPools = ['STUDY_GUIDE_ELIMINATION', 'GENERAL_SYSTEMS'];
      }

      getRandomVariablePair() {
        const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
        const idx1 = getRandomInt(0, letters.length - 1);
        let idx2 = getRandomInt(0, letters.length - 1);
        while (idx2 === idx1) idx2 = getRandomInt(0, letters.length - 1);
        return [letters[idx1], letters[idx2]];
      }

      generateSingleProblem(type) {
        const [v1, v2] = this.getRandomVariablePair();
        const sol1 = getRandomInt(2, 10), sol2 = getRandomInt(1, 15);
        const c2 = getRandomInt(1, 5), c1 = c2 + getRandomInt(1, 4);
        const C1 = c1 * sol1 - sol2, C2 = c2 * sol1 - sol2;

        const promptLatex = `\\begin{array}{l} ${c1}${v1} - ${v2} = ${C1} \\\\ ${c2}${v1} - ${v2} = ${C2} \\end{array}`;
        const correctAnswer = `${v1} = ${sol1}, ${v2} = ${sol2}`;

        const rawOptions = [
          correctAnswer,
          `${v1} = ${sol1 + 1}, ${v2} = ${sol2}`,
          `${v1} = ${sol1}, ${v2} = ${sol2 + 2}`,
          `${v1} = ${Math.max(1, sol1 - 1)}, ${v2} = ${sol2 + 3}`
        ];

        const options = ensureUniqueOptions(correctAnswer, rawOptions);

        return {
          id: `sys_${Date.now()}_${getRandomInt(100, 999)}`,
          prompt: 'Solve the system of equations:',
          promptLatex: `$${promptLatex}$`,
          correctAnswer,
          options,
          explanation: `Subtract equations to solve for variables. Result: ${correctAnswer}.`,
          points: 1
        };
      }

      generateBatch(count = 5) {
        return generateUniqueBatch(this, this.allPools, count);
      }
    }

    // Master Registry of All Generator Classes
    const MODULE_MAP = {
      'WHOLE_NUMBERS': new WholeNumberArithmeticGenerator(),
      'FRACTION_ARITHMETIC': new FractionArithmeticGenerator(),
      'FRACTION_CONCEPTS': new FractionConceptsGenerator(),
      'DECIMAL_MULT_SG': new DecimalMultiplicationStudyGuideGenerator(),
      'DECIMAL_ARITHMETIC': new DecimalArithmeticGenerator(),
      'DECIMAL_TO_FRACTION': new DecimalToFractionGenerator(),
      'NUMBER_CONVERSIONS': new NumberConversionsGenerator(),
      'FRAC_PCT_OF_NUM': new FractionPercentOfNumberGenerator(),
      'APPLIED_PERCENTS': new AppliedPercentsGenerator(),
      'EXPONENTS_POWERS': new ExponentsAndPowersGenerator(),
      'ALGEBRAIC_EVAL': new AlgebraicEvaluationGenerator(),
      'ORDER_OF_OPERATIONS': new OrderOfOperationsIntegersGenerator(),
      'POLYNOMIAL_ARITHMETIC': new PolynomialArithmeticGenerator(),
      'SYSTEMS_EQUATIONS': new SystemsOfEquationsGenerator()
    };

    class ComprehensivePracticeExamGenerator {
      generateBatch(count = 25) {
        const examBlueprint = [
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'ADD_MIXED_DIGITS' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'SUB_SIMPLE' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'ADD_COLUMN_STACK' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'SUB_REGROUPING' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'ADD_LIKE_DENOM' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'ADD_MIXED_STACK' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'ADD_UNLIKE_DENOM' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'SUB_WHOLE_MINUS_MIXED' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'SUB_REGROUPING_MIXED' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'MULT_BASIC' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'MULT_ADVANCED' },
          { gen: MODULE_MAP['DECIMAL_MULT_SG'], pool: 'MULT_WHOLE_BY_TENTHS' },
          { gen: MODULE_MAP['DECIMAL_MULT_SG'], pool: 'MULT_TENTHS_BY_HUNDREDTHS' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'DIV_EXACT' },
          { gen: MODULE_MAP['WHOLE_NUMBERS'], pool: 'DIV_REMAINDER' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'MULT_PROPER' },
          { gen: MODULE_MAP['FRACTION_ARITHMETIC'], pool: 'DIV_PROPER' },
          { gen: MODULE_MAP['FRAC_PCT_OF_NUM'], pool: 'FRACTION_OF_NUMBER' },
          { gen: MODULE_MAP['FRAC_PCT_OF_NUM'], pool: 'PERCENT_OF_NUMBER' },
          { gen: MODULE_MAP['DECIMAL_TO_FRACTION'], pool: 'DECIMAL_TO_FRACTION' },
          { gen: MODULE_MAP['EXPONENTS_POWERS'], pool: 'BASIC_EXPONENTS' },
          { gen: MODULE_MAP['ALGEBRAIC_EVAL'], pool: 'TWO_VARIABLE_LINEAR' },
          { gen: MODULE_MAP['ORDER_OF_OPERATIONS'], pool: 'FRACTIONAL_PEMDAS_STUDY_GUIDE' },
          { gen: MODULE_MAP['POLYNOMIAL_ARITHMETIC'], pool: 'STACKED_TWO_VARIABLE' },
          { gen: MODULE_MAP['SYSTEMS_EQUATIONS'], pool: 'STUDY_GUIDE_ELIMINATION' }
        ];

        const questions = [];
        const targetCount = Math.min(count, 25);

        for (let i = 0; i < targetCount; i++) {
          try {
            const step = examBlueprint[i];
            if (step && step.gen && typeof step.gen.generateSingleProblem === 'function') {
              questions.push(step.gen.generateSingleProblem(step.pool));
            }
          } catch (err) {
            console.error(`Error generating question #${i + 1}:`, err);
          }
        }
        return questions;
      }
    }

    MODULE_MAP['COMPREHENSIVE_EXAM'] = new ComprehensivePracticeExamGenerator();

    /****************************************************************
     * UI ENGINE & INTERACTIVE STATE MANAGEMENT
     ****************************************************************/

    const moduleSelect = document.getElementById('module-select');
    const countInput = document.getElementById('count-input');
    const generateBtn = document.getElementById('generate-btn');
    const shareLinkBtn = document.getElementById('share-link-btn');
    const quizContainer = document.getElementById('quiz-container');
    const submitBtn = document.getElementById('submit-btn');
    const scoreBanner = document.getElementById('score-banner');
    const scoreDetails = document.getElementById('score-details');
    const teacherControls = document.getElementById('teacher-controls');
    const studentInfoCard = document.getElementById('student-info-card');
    const studentCategoryHeader = document.getElementById('student-category-header');

    let currentQuestions = [];
    let userSelections = {};
    let isSubmitted = false;
    let isStudentMode = false;
    let currentCategoryTitle = "";

    function checkStudentMode() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'student' || window.location.hash.startsWith('#quiz=')) {
        isStudentMode = true;
        teacherControls.classList.add('hidden');
        studentInfoCard.classList.remove('hidden');

        currentCategoryTitle = urlParams.get('cat') || "Practice Quiz";
        studentCategoryHeader.innerText = `Category: ${currentCategoryTitle}`;

        if (window.location.hash.startsWith('#quiz=')) {
          try {
            const jsonStr = decodeURIComponent(atob(window.location.hash.replace('#quiz=', '')));
            currentQuestions = JSON.parse(jsonStr);
            renderQuiz();
            return true;
          } catch (e) {
            console.error("Error decoding hash payload", e);
          }
        }
      }
      return false;
    }

    function generateQuiz() {
      const selectedKey = moduleSelect.value;
      let count = parseInt(countInput.value) || 5;

      if (selectedKey === 'COMPREHENSIVE_EXAM') {
        count = 25;
      }

      const generator = MODULE_MAP[selectedKey] || MODULE_MAP['WHOLE_NUMBERS'];
      currentCategoryTitle = moduleSelect.options[moduleSelect.selectedIndex].text;

      currentQuestions = generator.generateBatch(count);
      userSelections = {};
      isSubmitted = false;
      scoreBanner.classList.add('hidden');

      renderQuiz();
    }

    function renderQuiz() {
      quizContainer.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const selectedIndex = userSelections[q.id];

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
          let labelClass = 'option-label';
          if (isSubmitted) {
            if (opt === q.correctAnswer) {
              labelClass += ' correct-choice';
            } else if (selectedIndex === optIdx) {
              labelClass += ' incorrect-choice';
            }
          }

          optionsHTML += `
            <label class="${labelClass}">
              <input type="radio" name="${q.id}" value="${optIdx}" 
                ${selectedIndex === optIdx ? 'checked' : ''} 
                ${isSubmitted ? 'disabled' : ''}
                onchange="handleSelect('${q.id}', ${optIdx})">
              <span>$${opt}$</span>
            </label>
          `;
        });

        let feedbackHTML = '';
        if (isSubmitted) {
          const isCorrect = selectedIndex !== undefined && q.options[selectedIndex] === q.correctAnswer;
          feedbackHTML = `
            <div class="feedback-box ${isCorrect ? 'correct' : 'incorrect'}">
              <strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong>
              <div class="explanation-text"><strong>Solution:</strong> $${q.explanation}$</div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="question-header">
            <span class="question-num">Question ${idx + 1}</span>
            <span class="question-points">${q.points} Point${q.points > 1 ? 's' : ''}</span>
          </div>
          <div class="question-prompt">${q.prompt}</div>
          <div class="math-display">${q.promptLatex}</div>
          <div class="options-grid">${optionsHTML}</div>
          ${feedbackHTML}
        `;

        quizContainer.appendChild(card);
      });

      submitBtn.classList.remove('hidden');

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    window.handleSelect = function(qId, optIdx) {
      if (isSubmitted) return;
      userSelections[qId] = optIdx;
    };

    function submitQuiz() {
      let firstName = "", lastName = "";

      if (isStudentMode) {
        firstName = document.getElementById('student-first-name').value.trim();
        lastName = document.getElementById('student-last-name').value.trim();

        if (!firstName || !lastName) {
          alert('Please enter both your First Name and Last Name before submitting.');
          return;
        }
      }

      if (isSubmitted) return;
      isSubmitted = true;
      
      let score = 0;
      let totalPoints = 0;

      currentQuestions.forEach(q => {
        totalPoints += q.points;
        const selectedIdx = userSelections[q.id];
        if (selectedIdx !== undefined && q.options[selectedIdx] === q.correctAnswer) {
          score += q.points;
        }
      });

      const pct = Math.round((score / totalPoints) * 100);
      scoreDetails.innerHTML = `You scored <strong>${score} / ${totalPoints}</strong> points (${pct}%).`;
      scoreBanner.classList.remove('hidden');
      submitBtn.classList.add('hidden');

      renderQuiz();

     if (window.MathJax && window.MathJax.typesetPromise) {
  MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
}

      // Send Score & Name Payload to Google Sheet
      if (isStudentMode && APPS_SCRIPT_URL) {
        const payload = {
          firstName: firstName,
          lastName: lastName,
          quizCategory: currentCategoryTitle,
          score: score,
          totalPoints: totalPoints,
          percentage: pct
        };

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          alert("Quiz submitted successfully! Your score has been recorded.");
        }).catch(err => console.error("Error logging score to Google Sheets:", err));
      }
    }

    function generateShareableLink() {
      const payloadStr = btoa(encodeURIComponent(JSON.stringify(currentQuestions)));
      const baseUrl = window.location.href.split('?')[0].split('#')[0];
      const categoryParam = encodeURIComponent(currentCategoryTitle);
      const studentUrl = `${baseUrl}?mode=student&cat=${categoryParam}#quiz=${payloadStr}`;

      navigator.clipboard.writeText(studentUrl).then(() => {
        alert("Student quiz link copied to clipboard!\n\nWhen students open this link, teacher controls will be hidden, First & Last name will be required, and their score will log automatically to your Google Sheet.");
      }).catch(err => {
        prompt("Copy this link for your students:", studentUrl);
      });
    }

    // UI Event Listeners
    generateBtn.addEventListener('click', generateQuiz);
    submitBtn.addEventListener('click', submitQuiz);
    shareLinkBtn.addEventListener('click', generateShareableLink);

    moduleSelect.addEventListener('change', () => {
      if (moduleSelect.value === 'COMPREHENSIVE_EXAM') {
        countInput.value = 25;
        countInput.disabled = true;
      } else {
        countInput.disabled = false;
        countInput.max = 25;
      }
    });

    // Page Load Initialization
    if (!checkStudentMode()) {
      generateQuiz();
    }
  </script>
</body>
</html>
